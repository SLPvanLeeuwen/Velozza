<!DOCTYPE html>
<html lang="en" class="bg-black text-white">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin – Velozza Events</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="p-6 max-w-3xl mx-auto font-sans">
  <header class="text-center mb-8">
    <img src="materiaal/Velozza_logo-transparant.webp" alt="Velozza" class="h-24 mx-auto glow" />
    <h1 class="mt-4 text-3xl font-bold text-[var(--accent)]">Admin Panel</h1>
  </header>

  <form id="loginForm" class="space-y-4">
    <h2 class="text-xl font-semibold">Login</h2>
    <input type="email" id="mailInput" placeholder="Enter admin email"
      class="w-full p-3 bg-zinc-900 border border-zinc-700 rounded" />
    <div class='relative'>
      <input type="password" id="passwordInput" placeholder="Enter admin password"
        class="w-full p-3 bg-zinc-900 border border-zinc-700 rounded" />

      <button type="button" id="togglePassword"
        class="absolute inset-y-0 right-0 flex items-center pr-4 text-zinc-400 hover:text-white">
        <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
          stroke="currentColor" class="w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
        </svg>
        <svg id="eyeOffIcon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
          stroke="currentColor" class="w-5 h-5 hidden">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
        </svg>
      </button>
    </div>
    <button type="submit" id="loginBtn" class="px-4 py-2 bg-[var(--accent)] rounded hover:bg-red-700">Login</button>
    <p id="authStatus" class="text-sm mt-2 text-zinc-400"></p>
  </form>

  <div id="adminPanel" class="hidden mt-10 space-y-6">
    <button id="logoutBtn" class="px-4 py-2 bg-[var(--accent)] rounded hover:bg-red-700">
      Log Out
    </button>

    <section>
      <h2 class="text-2xl font-semibold text-gray-200">Add Merchandise</h2>
      <div class="grid grid-cols-1 gap-3 mt-4">
        <input type="text" id="prodName" placeholder="Product Name (e.g., Humanity T-Shirt)"
          class="p-3 bg-zinc-900 border border-zinc-700 rounded" />
        <input type="text" id="prodDesc"
          placeholder="Product Desc (e.g., Humanity T-Shirt cotton size: xs, s, m, L, XL, 2XL)"
          class="p-3 bg-zinc-900 border border-zinc-700 rounded" />
        <input type="number" id="prodPrice" placeholder="Price in Euros (e.g., 25)"
          class="p-3 bg-zinc-900 border border-zinc-700 rounded" />
        <input type="number" id="prodStock" placeholder="Stock Quantity"
          class="p-3 bg-zinc-900 border border-zinc-700 rounded" />
        <input type="file" id="prodImage" accept="image/*"
          class="p-3 bg-zinc-900 border border-zinc-700 rounded text-gray-400" />
        <input type="text" id="prodStripeId" placeholder="Stripe Price ID (from Stripe Dashboard)"
          class="p-3 bg-zinc-900 border border-zinc-700 rounded" />
      </div>
      <button id="saveProduct" class="mt-3 px-4 py-2 bg-[var(--accent)] rounded hover:bg-red-700">Save Product</button>
      <div id="prodMsg" class="text-green-400 mt-2"></div>
    </section>

    <section class="mt-10">
      <h2 class="text-2xl font-semibold text-gray-200">Manage Inventory</h2>
      <div id="productList" class="mt-4 space-y-3"></div>
    </section>

    <section>
      <h2 class="text-2xl font-semibold text-gray-200">Add Event</h2>
      <div class="grid grid-cols-1 gap-3 mt-4">
        <input type="date" id="eventDate" class="p-3 bg-zinc-900 border border-zinc-700 rounded" />
        <input type="text" id="eventName" placeholder="Event name"
          class="p-3 bg-zinc-900 border border-zinc-700 rounded" />
        <input type="text" id="eventLocation" placeholder="Location"
          class="p-3 bg-zinc-900 border border-zinc-700 rounded" />
        <input type="text" id="eventCity" placeholder="City" class="p-3 bg-zinc-900 border border-zinc-700 rounded" />
        <input type="text" id="eventCountry" placeholder="Country"
          class="p-3 bg-zinc-900 border border-zinc-700 rounded" />
        <input type="text" id="eventTime" placeholder="Time (optional)"
          class="p-3 bg-zinc-900 border border-zinc-700 rounded" />
        <input type="text" id="eventLink" placeholder="Ticket link (optional)"
          class="p-3 bg-zinc-900 border border-zinc-700 rounded" />
        <input type="file" id="eventPoster" accept="image/png, image/jpeg, image/webp"
          class="p-3 bg-zinc-900 border border-zinc-700 rounded text-sm text-zinc-400 file:mr-3 file:py-2 file:px-3 file:rounded file:border-0 file:bg-[var(--accent)] file:text-white file:cursor-pointer" />
      </div>
      <div class="flex items-center gap-3 mt-3">
        <button id="saveEvent" class="px-4 py-2 bg-[var(--accent)] rounded hover:bg-red-700">Save Event</button>
        <div id="saveMsg" class="text-green-400"></div>
      </div>
    </section>

    <hr class="border-zinc-700" />

    <section>
      <h2 class="text-2xl font-semibold text-gray-200">Manage Events</h2>
      <div id="eventList" class="mt-4 space-y-3"></div>
    </section>
  </div>

  <!-- EDIT MODAL -->
  <div id="editModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
    <div id="editCard" class="bg-zinc-900 p-6 rounded-xl w-full max-w-lg shadow-lg border border-zinc-700">
      <h3 class="text-xl font-semibold text-[var(--accent)]">Edit Event</h3>
      <div class="grid grid-cols-1 gap-3 mt-4">
        <input id="editDate" type="date" class="p-3 bg-black border border-zinc-700 rounded" />
        <input id="editName" type="text" class="p-3 bg-black border border-zinc-700 rounded" />
        <input id="editLocation" type="text" class="p-3 bg-black border border-zinc-700 rounded" />
        <input id="editCity" type="text" class="p-3 bg-black border border-zinc-700 rounded" />
        <input id="editCountry" type="text" class="p-3 bg-black border border-zinc-700 rounded" />
        <input id="editTime" type="text" class="p-3 bg-black border border-zinc-700 rounded" />
        <input id="editLink" type="text" class="p-3 bg-black border border-zinc-700 rounded" />
        <input type="file" id="editPoster" accept="image/png, image/jpeg, image/webp"
          class="p-3 bg-black border border-zinc-700 rounded text-sm text-zinc-400" />
      </div>

      <div class="flex justify-between items-center gap-3 mt-4">
        <button id="cancelEdit" class="px-4 py-2 bg-zinc-700 rounded hover:bg-zinc-600">Cancel</button>
        <div class="flex items-center gap-2">
          <button id="deleteEdit" class="px-4 py-2 bg-red-600 rounded hover:bg-red-700">Delete</button>
          <button id="saveEdit" class="px-4 py-2 bg-[var(--accent)] rounded hover:bg-red-700">Save changes</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/admin.js" type="module"></script>
</body>

</html>
